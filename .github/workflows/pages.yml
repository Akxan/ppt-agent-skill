# 把 26 风格画廊（ppt-output/style-gallery/）发布到 GitHub Pages
# 站点地址：https://akxan.github.io/ppt-agent-skill/
name: 发布风格画廊

on:
  push:
    branches: [main]
    paths:
      - "ppt-output/style-gallery/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ppt-output/style-gallery
      - id: deployment
        uses: actions/deploy-pages@v4
